[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casmi26"
version = "0.11.0"
description = "Leakage-safe hybrid retrieval baselines for Enveda CASMI 2026"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "joblib>=1.3",
  "numba>=0.60",
  "numpy>=1.26",
  "pandas>=2.1",
  "polars>=1.0",
  "pyarrow>=15",
  "PyYAML>=6",
  "rdkit==2026.3.3",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "tqdm>=4.66",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "lightgbm>=4.3"]
dev = ["kagglehub>=1.0", "pytest>=8", "psutil>=5.9", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
