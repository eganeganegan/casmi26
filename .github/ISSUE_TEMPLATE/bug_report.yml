name: Bug report
description: Report a reproducible defect in the pipeline or tooling
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, competition rows, or licensed database records.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command and a synthetic or non-sensitive example where possible.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: commit SHA or package version
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux / Kaggle
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
